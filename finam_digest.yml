name: Finam Digest → Telegram

on:
  schedule:
    # ── Ежедневный дайджест: пн-пт в 9:00 МСК (6:00 UTC) ──
    - cron: '0 6 * * 1-5'
    # ── Еженедельный сводный: пн в 9:30 МСК (6:30 UTC) ──
    - cron: '30 6 * * 1'

  # Запуск вручную из интерфейса GitHub (для теста)
  workflow_dispatch:
    inputs:
      mode:
        description: 'Режим: daily или weekly'
        required: true
        default: 'daily'
        type: choice
        options:
          - daily
          - weekly

jobs:
  send-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Получить код из репозитория
        uses: actions/checkout@v4

      # Восстанавливаем кэш уже отправленных статей между запусками
      - name: 💾 Восстановить кэш seen_ids
        uses: actions/cache@v4
        with:
          path: seen_ids.json
          key: seen-ids-${{ github.run_id }}
          restore-keys: seen-ids-

      - name: 🐍 Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Установить зависимости
        run: pip install feedparser anthropic

      - name: 🗞️ Определить режим запуска
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> $GITHUB_OUTPUT
          elif [ "$(date -u +%M)" = "30" ]; then
            echo "mode=weekly" >> $GITHUB_OUTPUT
          else
            echo "mode=daily" >> $GITHUB_OUTPUT
          fi

      - name: 📨 Запустить скрипт дайджеста
        run: python finam_digest.py ${{ steps.mode.outputs.mode }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
